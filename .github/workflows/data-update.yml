name: Update population data

on:
  schedule:
    - cron: '17 21 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: population-data-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and validate in staging directory
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          STAGING_DIR: ${{ runner.temp }}/population-data
        run: |
          python -m src.ingestion.download --data-dir "$STAGING_DIR"
          python -m src.processing.build_dataset --data-dir "$STAGING_DIR"
      - name: Replace published data after validation
        env:
          STAGING_DIR: ${{ runner.temp }}/population-data
        run: |
          cp "$STAGING_DIR/bronze/population_by_age_group.csv" data/bronze/
          cp "$STAGING_DIR/silver/"*.csv "$STAGING_DIR/silver/"*.parquet data/silver/
          cp "$STAGING_DIR/gold/"*.csv "$STAGING_DIR/gold/"*.parquet data/gold/
          pytest -q
      - name: Commit changed datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bronze/population_by_age_group.csv data/silver/*.csv data/silver/*.parquet data/gold/*.csv data/gold/*.parquet
          if git diff --cached --quiet; then
            echo 'No dataset changes.'
            exit 0
          fi
          git commit -m 'chore: refresh population datasets'
          git push origin HEAD:main
