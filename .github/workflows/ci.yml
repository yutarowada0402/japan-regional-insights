name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check src app tests
      - name: Test
        run: pytest -q
      - name: Validate dbt with test fixture
        env:
          JRI_BRONZE_CSV: ${{ github.workspace }}/tests/fixtures/bronze_sample.csv
          JRI_DUCKDB_PATH: ${{ runner.temp }}/fixture.duckdb
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Rebuild committed public data and static site
        run: |
          python -m src.processing.build_dataset
          python -m src.processing.build_static_site
          test -s docs/index.html
          test -s docs/plotly.min.js
